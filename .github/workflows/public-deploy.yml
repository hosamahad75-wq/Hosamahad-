name: Public Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render (Backend)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: ${{ env.RENDER_HOOK != '' }}
        run: |
          curl -X POST "$RENDER_HOOK"

      - name: Install frontend dependencies
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install

      - name: Build frontend
        run: |
          cd frontend
          pnpm build

      - name: Deploy to Netlify (Frontend)
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        if: ${{ env.NETLIFY_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=frontend/dist --auth="$NETLIFY_TOKEN" --site="$NETLIFY_SITE_ID"
