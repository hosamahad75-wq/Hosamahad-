name: Public Deploy
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render (Backend)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "WARNING: RENDER_DEPLOY_HOOK secret is missing. Skipping Render backend deployment."
            exit 0
          fi
          curl -X POST "$RENDER_HOOK"

      - name: Install frontend dependencies
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install

      - name: Build frontend
        run: |
          cd frontend
          pnpm build

      - name: Deploy to Netlify (Frontend)
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "WARNING: NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is missing. Skipping Netlify frontend deployment."
            exit 0
          fi
          npm install -g netlify-cli
          netlify deploy --prod --dir=frontend/dist --auth="$NETLIFY_TOKEN" --site="$NETLIFY_SITE_ID"
